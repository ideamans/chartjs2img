name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - id: version
        name: Verify tag matches package.json and plugin.json versions
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PLUGIN_VERSION="$(node -p "require('./plugins/chartjs2img/.claude-plugin/plugin.json').version")"
          echo "tag=$TAG  tag_version=$TAG_VERSION  package.json=$PKG_VERSION  plugin.json=$PLUGIN_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          if [ "$PLUGIN_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::plugin.json version ($PLUGIN_VERSION) does not match package.json version ($PKG_VERSION). Run 'bun run validate-plugin-skills' locally."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: verify-version
    # Build each target on a NATIVE runner. The default skia engine bundles
    # skia-canvas, whose native .node module is platform-specific and cannot
    # be cross-compiled — a cross-target `bun --compile` embeds the build
    # host's skia.node and the binary fails at runtime (dlopen) on other
    # platforms. Native compile (no --target) embeds the correct binary.
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            ext: tar.gz
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            ext: tar.gz
          # darwin-amd64 (Intel Mac) is intentionally not built: the
          # macos-13 Intel runner queue is unreliable, and Intel Macs are
          # legacy. Apple Silicon (darwin-arm64) covers modern Macs; Intel
          # users can run via `bun`, Docker, npm, or build from source.
          - runner: macos-14
            os: darwin
            arch: arm64
            ext: tar.gz
          - runner: windows-latest
            os: windows
            arch: amd64
            ext: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Pin Bun for reproducible compiled binaries. Bump only after
          # verifying a fresh release cut on every target platform.
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile binary (native)
        shell: bash
        env:
          OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          if [ "$OS" = "windows" ]; then
            BIN=chartjs2img.exe
          else
            BIN=chartjs2img
          fi
          bun build src/index.ts --compile --outfile "$BIN"

      - name: Stage archive contents
        shell: bash
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          NAME="chartjs2img_${VERSION}_${OS}_${ARCH}"
          echo "ARCHIVE_NAME=$NAME" >> "$GITHUB_ENV"
          mkdir -p "dist/$NAME"
          if [ "$OS" = "windows" ]; then
            mv chartjs2img.exe "dist/$NAME/"
          else
            mv chartjs2img "dist/$NAME/"
          fi
          [ -f README.md ] && cp README.md "dist/$NAME/" || true
          [ -f LICENSE ] && cp LICENSE "dist/$NAME/" || true

      - name: Create archive (tar.gz)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          cd dist && tar -czf "${ARCHIVE_NAME}.tar.gz" "$ARCHIVE_NAME"

      - name: Create archive (zip)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/$env:ARCHIVE_NAME" -DestinationPath "dist/$env:ARCHIVE_NAME.zip"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: dist/${{ env.ARCHIVE_NAME }}.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          # Only the binary archives. Without this, download-artifact also
          # tries to fetch the `*.dockerbuild` metadata artifact that
          # docker/build-push-action uploads, which it cannot extract and
          # which fails the whole step ("download failed after 5 retries").
          pattern: chartjs2img_*

      - name: Collect archives and generate checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
          # Keep the per-archive .sha256 files so the install skill and
          # older docs that fetch `<asset>.sha256` continue to work.
          for f in *.tar.gz *.zip; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/checksums.txt

  docker:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_REPO }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
